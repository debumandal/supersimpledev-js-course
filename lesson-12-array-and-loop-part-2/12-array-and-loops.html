      function arrayDouble(nums) {
        const numDouble = [];

        for (let i = 0; i < nums.length; i++) {
          if (nums[i] === 0) {
            continue;
          }
          const num = nums[i];
          numDouble.push(num * 2);
        }
        return numDouble;
      }
