      //11w.
      function findIndex(array, word) {
        let index = -1;
        for (let i = 0; i < array.length; i++) {
          if (array[i] === word) {
            return i;
          }
        }
        return index;
      }

      function unique(array) {
        const newArray = [];
        for (let i = 0; i < array.length; i++) {
          const currentString = array[i];
          if (findIndex(newArray, currentString) === -1) {
            newArray.push(currentString);
          }
        }
        return newArray;
      }

      console.log(unique(["green", "red", "blue", "red"]));
      console.log(unique(["red", "green", "red", "green"]));
