<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="./styles/13-rock-paper-scissors.css" />
  </head>

  <body>
    <p><a class="link" href="./13-advance-function.html">Back</a></p>

    <p class="title">Rock Paper Scissors</p>

    <p>
      <button class="move-button" onclick="playGame('rock')">
        <img src="./images/rock-emoji.png" class="move-icon" alt="" />
      </button>

      <button class="move-button" onclick="playGame('paper')">
        <img src="./images/paper-emoji.png" class="move-icon" alt="" />
      </button>

      <button class="move-button" onclick="playGame('scissors')">
        <img src="./images/scissors-emoji.png" class="move-icon" alt="" />
      </button>
    </p>

    <p class="js-result result"></p>
    <p class="js-moves moves"></p>
    <p class="js-score"></p>

    <button
      onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        localStorage.removeItem('score');
        scoreDisplay();
      "
      class="reset-button"
    >
      Reset Score
    </button>

    <button class="auto-play-button" onclick="autoPlay()">Auto Play</button>

    <script src="./scripts/13-rock-paper-scissors.js"></script>
  </body>
</html>
