      const nums = [1, 1, 3];
      let result = 0;

      for (let i = 0; i < nums.length; i++) {
        const num = nums[i];
        result += num;
      }

      console.log(result);

      const numDouble = [];

      for (let i = 0; i < nums.length; i++) {
        const num = nums[i];
        numDouble.push(num * 2);
      }
      console.log(numDouble);
