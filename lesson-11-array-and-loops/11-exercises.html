      console.log(countWord(["apple", "grape", "apple", "apple"]));
      function countWord(words) {
        let result = {};
        for (let i = 0; i < words.length; i++) {
          let currentWord = words[i];
          if (result[currentWord]) {
            result[currentWord]++;
          } else {
            result[currentWord] = 1;
          }
        }
        return result;
      }
      /* 11l & 11m
      console.log(minMax([1, -3, 5]));

      console.log(minMax([3]));
      console.log(minMax([]));
      function minMax(nums) {
        let result = {
          min: nums[0],
          max: nums[0],
        };

        if (nums.length === 0) {
          return { min: null, max: null };
        }

        for (let i = 0; i < nums.length; i++) {
          let current = nums[i];
          if (current > result.max) {
            result.max = current;
          }

          if (current < result.min) {
            result.min = current;
          }
        }
        return result;
      }
