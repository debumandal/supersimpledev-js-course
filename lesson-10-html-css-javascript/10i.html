<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles/10i-exercise.css" />
  </head>
  <body>
    <p><a href="./10-dom-projects.html">Back</a></p>

    <p class="display js-display"></p>
    <p>
      <button class="btn" onclick="updateCalculation('1')">1</button>
      <button class="btn" onclick="updateCalculation('2')">2</button>
      <button class="btn" onclick="updateCalculation('3')">3</button>
      <button class="btn operator" onclick="updateCalculation(' + ')">+</button>
    </p>

    <p>
      <button class="btn" onclick="updateCalculation('4')">4</button>
      <button class="btn" onclick="updateCalculation('5')">5</button>
      <button class="btn" onclick="updateCalculation('6')">6</button>

      <button class="btn operator" onclick="updateCalculation(' - ')">-</button>
    </p>

    <p>
      <button class="btn" onclick="updateCalculation('7')">7</button>
      <button class="btn" onclick="updateCalculation('8')">8</button>
      <button class="btn" onclick="updateCalculation('9')">9</button>

      <button class="btn operator" onclick="updateCalculation(' * ')">*</button>
    </p>
    <p>
      <button
        class="btn"
        onclick="
          calculation = eval(calculation);
          // console.log(calculation);
          displayPage();
          localStorage.setItem('calculation', calculation);
        "
      >
        =
      </button>

      <button class="btn" onclick="updateCalculation('0')">0</button>

      <button class="btn" onclick="updateCalculation('.')">.</button>

      <button class="btn operator" onclick="updateCalculation(' / ')">/</button>
    </p>

    <p>
      <button
        class="btn"
        onclick="
          calculation = '';
          localStorage.removeItem('calculation');
          console.log('cleared.');
          displayPage();
        "
      >
        Clear
      </button>
    </p>

    <script src="./scripts/10i-exercise.js"></script>
  </body>
</html>
