<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 10h</title>
    <style>
      .cost-input {
        border: 0.125rem solid black;
        font-size: 1rem;
        padding: 0.625rem;
      }

      .calculate-button {
        font-size: 1rem;
        border: none;
        background-color: green;
        color: white;
        padding: 0.725rem;
      }

      .text-error {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <p><a href="./10-dom-projects.html">Back</a></p>
    <p>Amazon Shipping Calculator</p>
    <input
      class="js-input-element cost-input"
      placeholder="cost of order"
      onkeydown="handleCostKeyDown(event)"
    />
    <button
      onclick="shippingCalculator()"
      class="js-button-element calculate-button"
    >
      Calculate
    </button>
    <p class="js-total-cost"></p>

    <script>
      function handleCostKeyDown(event) {
        if (event.key === "Enter") {
          shippingCalculator();
        }
      }

      function shippingCalculator() {
        const inputElement = document.querySelector(".js-input-element");

        let cost = Number(inputElement.value);

        if (cost < 0) {
          document.querySelector(".js-total-cost").classList.add("text-error");
          document.querySelector(".js-total-cost").innerHTML =
            "Error: cost cannot be less than $0";
        } else if (cost < 40) {
          cost = cost + 10;
          document.querySelector(".js-total-cost").innerHTML = `$${cost}`;
        } else {
          cost;
          document.querySelector(".js-total-cost").innerHTML = `$${cost}`;
        }
      }
    </script>
  </body>
</html>
