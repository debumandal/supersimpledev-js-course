      const product2 = {
        rating: 4.5,
        count: 87,
        option: {
          first_shop: 90,
          second_shop: 88,
          third_shop: 85,
        },
        "delivery-time": "1 Day",
        fun: function function1() {
          console.log(
            "We can use function inside object because it is a type of value",
          );
        },
      };

      console.log(product2.rating);
      console.log(product2.count);
      // in a particular situation we can't use dot notation
      // console.log(product2.'delivery-time')
      // we use square brackets
      console.log(product2["delivery-time"]);
      console.log(product2.fun);
      console.log(product2.option.first_shop);

      console.log(JSON.stringify(product2));
      const jsonString = JSON.stringify(product2);
      console.log(JSON.parse(jsonString));

      const object = {
        message: "hello",
        price: 799,
      };

      const { message, price } = object;
      console.log(message);
      console.log(price);
